<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 930" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1500" height="930" fill="#fafbfc"/>

  <text x="750" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">Agent 眼里的 OpenViking：它为什么「看起来」就是一个文件系统</text>
  <text x="750" y="70" text-anchor="middle" font-size="14" fill="#64748b">Agent 没有 OS 的眼睛——它看到的只有工具返回。文件系统感来自四个可原样迁移的示能（affordances）</text>

  <!-- Left: agent -->
  <rect x="55" y="105" width="250" height="150" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Agent（编码 / 通用）</text>
  <text x="180" y="168" text-anchor="middle" font-size="12.5" fill="#475569">已在真实文件系统上习得：</text>
  <text x="180" y="190" text-anchor="middle" font-size="12.5" fill="#475569">路径直觉 · 导航动作 · 渐进读取</text>
  <text x="180" y="228" text-anchor="middle" font-size="12" fill="#94a3b8">它不区分「真 FS」与「像 FS」——</text>
  <text x="180" y="246" text-anchor="middle" font-size="12" fill="#94a3b8">示能一致，行为就一致</text>

  <rect x="55" y="285" width="250" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="180" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">viking 工具动词</text>
  <text x="180" y="340" text-anchor="middle" font-size="13" fill="#475569" font-family="'SF Mono',Consolas,monospace">ls tree read write mv cp</text>
  <text x="180" y="362" text-anchor="middle" font-size="13" fill="#475569" font-family="'SF Mono',Consolas,monospace">grep glob stat mkdir rm</text>
  <text x="180" y="395" text-anchor="middle" font-size="12.5" fill="#7c3aed">＋ 超能力：find / search</text>
  <text x="180" y="414" text-anchor="middle" font-size="11" fill="#94a3b8">（语义检索，真实 FS 没有）</text>

  <line x1="310" y1="290" x2="352" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Center: terminal -->
  <rect x="360" y="105" width="560" height="425" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <rect x="360" y="105" width="560" height="30" rx="10" fill="#1e293b"/>
  <circle cx="382" cy="120" r="5" fill="#ef4444"/><circle cx="400" cy="120" r="5" fill="#f59e0b"/><circle cx="418" cy="120" r="5" fill="#22c55e"/>
  <text x="640" y="125" text-anchor="middle" font-size="12" fill="#94a3b8">agent 视角的一次导航（MCP 工具返回）</text>
  <g font-family="'SF Mono',Consolas,monospace" font-size="13">
    <text x="380" y="165" fill="#22d3ee">$ ls viking://user/u1/memories/</text>
    <text x="380" y="192" fill="#e2e8f0">.abstract.md        <tspan fill="#64748b"># L0 一句话摘要</tspan></text>
    <text x="380" y="216" fill="#e2e8f0">.overview.md        <tspan fill="#64748b"># L1 概览</tspan></text>
    <text x="380" y="240" fill="#e2e8f0">preferences/        <tspan fill="#64748b"># 目录=数据记录（自带摘要+向量）</tspan></text>
    <text x="380" y="264" fill="#e2e8f0">entities/</text>
    <text x="380" y="288" fill="#e2e8f0">events/</text>
    <text x="380" y="325" fill="#22d3ee">$ read viking://user/u1/memories/.abstract.md</text>
    <text x="380" y="352" fill="#a5b4fc">「用户偏好记忆区：口味 / 输出风格 / 工具习惯…」</text>
    <text x="380" y="389" fill="#22d3ee">$ find "用户喜欢什么输出风格"</text>
    <text x="380" y="416" fill="#34d399">0.91  viking://user/u1/memories/preferences/output-style.md</text>
    <text x="380" y="440" fill="#34d399">0.77  viking://user/u1/memories/.overview.md</text>
    <text x="380" y="478" fill="#64748b">$ read …output-style.md   <tspan fill="#475569"># 命中后才读 L2 全文</tspan></text>
  </g>
  <rect x="360" y="545" width="560" height="80" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="640" y="576" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3730a3">ls → 读目录牌 → 进子目录 → 命中读全文</text>
  <text x="640" y="600" text-anchor="middle" font-size="12.5" fill="#4b5563">与在真实 FS 里「开目录 → 看牌子 → 翻文件」完全同构</text>

  <line x1="925" y1="290" x2="968" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Right: affordance cards -->
  <g>
    <rect x="975" y="105" width="470" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="995" y="133" font-size="14.5" font-weight="bold" fill="#0f172a">① 地址稳定</text>
    <text x="995" y="158" font-size="12" fill="#475569" font-family="'SF Mono',Consolas,monospace">/home/alice/notes/x.md ⇆ viking://user/u1/memories/x</text>
    <text x="995" y="182" font-size="11.5" fill="#7c3aed">mv/rm 会同步向量索引 URI —— 文件系统没有的副作用</text>

    <rect x="975" y="219" width="470" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="995" y="247" font-size="14.5" font-weight="bold" fill="#0f172a">② 可列举、可导航</text>
    <text x="995" y="272" font-size="12" fill="#475569">ls · tree · glob：agent 的导航动作原样可用</text>
    <text x="995" y="296" font-size="11.5" fill="#475569">且目录牌不是空的：每个目录自带 L0/L1 摘要</text>

    <rect x="975" y="333" width="470" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="995" y="361" font-size="14.5" font-weight="bold" fill="#0f172a">③ 渐进披露：L0 → L1 → L2</text>
    <text x="995" y="386" font-size="12" fill="#475569" font-family="'SF Mono',Consolas,monospace">read .abstract.md → .overview.md → 全文</text>
    <text x="995" y="410" font-size="11.5" fill="#475569">「先摘要后全文」是加载契约——token 纪律的物理化</text>

    <rect x="975" y="447" width="470" height="98" rx="10" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="995" y="475" font-size="14.5" font-weight="bold" fill="#0f172a">④ 内容检索 ＋ 语义超能力</text>
    <text x="995" y="500" font-size="12" fill="#475569">grep 正则照旧；find/search 向量做第一跳</text>
    <text x="995" y="524" font-size="11.5" fill="#7c3aed">「意思相近」也能进门——真实文件系统给不了</text>
  </g>

  <!-- Bottom: boundary strip -->
  <rect x="55" y="700" width="1390" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="750" y="734" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#334155">接入边界：MCP（15 工具）· HTTP API · ov CLI · SDK —— Agent 不经过 OS，OS 也看不到 viking://（无 FUSE / WinFSP 挂载）</text>
  <text x="750" y="766" text-anchor="middle" font-size="13.5" fill="#475569">文件系统示能（路径 ＋ 目录 ＋ 读取语义）× 数据库语义（ACL · 快照 · 向量 · 加密）= Agent 以为的「文件系统」</text>

  <text x="750" y="840" text-anchor="middle" font-size="12" fill="#94a3b8">陷阱提醒：find 不是按名字找文件（是语义检索）；append_file 是锁下整写重写；chmod 底层 no-op（权限只有 ACL）——详见 03-operation-semantics.md</text>
  <text x="1490" y="915" text-anchor="end" font-size="10.5" fill="#cbd5e1">_digested/vfs · 基线 0f77ab56</text>
</svg>
